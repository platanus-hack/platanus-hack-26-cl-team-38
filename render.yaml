services:
  - type: web
    name: team-38
    runtime: node
    region: virginia
    plan: standard
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    # Responde 503 mientras carga el modelo del filtro de privacidad: Render no manda tráfico hasta que esté listo.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # "haiku" (por defecto) u "opus": el modelo del juez de privacidad. Se cambia en el panel de Render.
      - key: PRIVACY_JUDGE_MODEL
        sync: false
